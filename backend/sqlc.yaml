version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/db/sqlcdb"
        emit_interface: true
        emit_json_tags: true
        emit_sql_as_comment: true
        overrides:
          - db_type: "text"
            nullable: true
            go_type:
              import: "github.com/marcinskalski/sailor-buddy/backend/internal/types"
              package: "types"
              type: "NullString"
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              import: "github.com/marcinskalski/sailor-buddy/backend/internal/types"
              package: "types"
              type: "NullInt64"
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type:
              import: "github.com/marcinskalski/sailor-buddy/backend/internal/types"
              package: "types"
              type: "NullFloat64"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "github.com/marcinskalski/sailor-buddy/backend/internal/types"
              package: "types"
              type: "NullTime"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "github.com/marcinskalski/sailor-buddy/backend/internal/types"
              package: "types"
              type: "NullTime"
          - db_type: "date"
            nullable: true
            go_type:
              import: "github.com/marcinskalski/sailor-buddy/backend/internal/types"
              package: "types"
              type: "NullTime"
