          type: number
        hours_sail:
          format: double
          type: number
        hours_total:
          format: double
          type: number
        image_logo_url:
          type: string
        image_photo_url:
          type: string
        image_route_url:
          type: string
        miles:
          format: double
          type: number
        name:
          description: Voyage name
          minLength: 1
          type: string
        start_port:
          type: string
        tidal_waters:
          format: int64
          type: integer
        track_url:
          description: Link to the track recording (http or https)
          maxLength: 2048
          type: string
        voyage_card:
          description: "Voyage card (Karta rejsu): who holds it or where it is"
          type: string
        yacht_id:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - name
        - cruise_id
      type: object
    VoyageLogBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/VoyageLogBody.json
          format: uri
          readOnly: true
          type: string
        captain_notes:
          description: Captain's note on the cruise
          type: string
        days:
          format: int64
          minimum: 0
          type: integer
        hours_engine:
          format: double
          minimum: 0
          type: number
        hours_over_6bf:
          format: double
          minimum: 0
          type: number
        hours_sail:
          format: double
          minimum: 0
          type: number
        hours_total:
          format: double
          minimum: 0
          type: number
        miles:
          format: double
          minimum: 0
          type: number
        tidal_waters:
          format: int64
          minimum: 0
          type: integer
        track_url:
          description: Link to the track recording (http or https)
          maxLength: 2048
          type: string
        voyage_card:
          description: "Voyage card (Karta rejsu): who holds it or where it is"
          type: string
        yacht_id:
          description: Yacht sailed; omit to clear
          format: int64
          type: integer
      type: object
    VoyageOpinion:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/VoyageOpinion.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        crew_member_id:
          format: int64
          type: integer
        file_format:
          type: string
        full_name:
          type: string
        id:
          format: int64
          type: integer
        voyage_id:
          format: int64
          type: integer
      required:
        - id
        - voyage_id
        - crew_member_id
        - file_format
        - created_at
      type: object
    VoyagePort:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/VoyagePort.json
          format: uri
          readOnly: true
          type: string
        anchorage:
          type: boolean
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
        position:
          format: int64
          type: integer
        voyage_id:
          format: int64
          type: integer
      required:
        - id
        - voyage_id
        - name
        - anchorage
        - position
        - created_at
      type: object
    VoyagePortBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/VoyagePortBody.json
          format: uri
          readOnly: true
          type: string
        anchorage:
          description: An anchorage rather than a harbour
          type: boolean
        latitude:
          description: Latitude; omit with longitude for a name-only port
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          description: Longitude; omit with latitude for a name-only port
          format: double
          maximum: 180
          minimum: -180
          type: number
        name:
          description: Port / town name
          minLength: 1
          type: string
        position:
          description: Order in the visited sequence
          format: int64
          minimum: 0
          type: integer
      required:
        - name
      type: object
    VoyagePortOrderBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/VoyagePortOrderBody.json
          format: uri
          readOnly: true
          type: string
        port_ids:
          description: Port IDs in the desired visit order
          items:
            format: int64
            type: integer
          minItems: 1
          type:
            - array
            - "null"
      required:
        - port_ids
      type: object
    VoyagesByYear:
      additionalProperties: false
      properties:
        total_days:
          format: int64
          type: integer
        total_hours:
          format: double
          type: number
        total_miles:
          format: double
          type: number
        voyage_count:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - voyage_count
        - total_hours
        - total_miles
        - total_days
      type: object
    Yacht:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/Yacht.json
          format: uri
          readOnly: true
          type: string
        berths:
          format: int64
          type: integer
        build_year:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        engine:
          type: string
        id:
          format: int64
          type: integer
        length_m:
          format: double
          type: number
        name:
          type: string
        owner_name:
          type: string
        registration_no:
          type: string
        updated_at:
          format: date-time
          type: string
        yacht_type:
          type: string
      required:
        - id
        - name
        - created_at
        - updated_at
      type: object
    YachtBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/YachtBody.json
          format: uri
          readOnly: true
          type: string
        berths:
          description: Number of berths
          format: int64
          minimum: 1
          type: integer
        build_year:
          description: Build year
          format: int64
          maximum: 2100
          minimum: 1800
          type: integer
        engine:
          description: Engine, e.g. Volvo Penta D2-55
          type: string
        length_m:
          description: Length overall in metres
          exclusiveMinimum: 0
          format: double
          type: number
        name:
          description: Yacht name
          minLength: 1
          type: string
        owner_name:
          description: Charter owner (armator)
          type: string
        registration_no:
          type: string
        yacht_type:
          type: string
      required:
        - name
      type: object
info:
  title: Sailor Buddy API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current authenticated user
      tags:
        - Auth
    put:
      operationId: update-me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Save the current user's profile and finish onboarding
      tags:
        - Auth
  /auth/me/cruises:
    get:
      operationId: list-my-cruises
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCruises"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cruises the current user took part in
      tags:
        - Auth
  /crew:
    get:
      operationId: list-crew
      parameters:
        - description: Maximum number of items to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of items to return
            format: int32
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of items to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip
            format: int32
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCrewMember"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List crew members
      tags:
        - Crew
    post:
      operationId: create-crew-member
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewMemberBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewMember"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a crew member (admin)
      tags:
        - Crew
  /crew/{crewID}:
    delete:
      operationId: delete-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a crew member (admin)
      tags:
        - Crew
    get:
      operationId: get-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewMember"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a crew member
      tags:
        - Crew
    put:
      operationId: update-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewMemberBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a crew member (admin)
      tags:
        - Crew
  /cruises:
    get:
      operationId: list-cruises
      parameters:
        - description: Maximum number of items to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of items to return
            format: int32
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of items to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip
            format: int32
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCruise"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List cruises
      tags:
        - Cruises
    post:
      operationId: create-cruise
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CruiseBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cruise"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a cruise (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}:
    delete:
      operationId: delete-cruise
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a cruise (admin)
      tags:
        - Cruises
    get:
      operationId: get-cruise
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cruise"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a cruise
      tags:
        - Cruises
    put:
      operationId: update-cruise
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CruiseBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a cruise (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}/enroll-token:
    delete:
      operationId: clear-cruise-enroll-token
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear a cruise enrollment token (admin)
      tags:
        - Cruises
    post:
      operationId: generate-cruise-enroll-token
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Generate a cruise enrollment token (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}/enrollments:
    get:
      operationId: list-cruise-enrollments
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CruiseEnrollmentDetail"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a cruise's enrollments (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}/enrollments/{enrollmentID}:
    delete:
      operationId: delete-cruise-enrollment
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
        - description: Enrollment ID
          in: path
          name: enrollmentID
          required: true
          schema:
            description: Enrollment ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a cruise enrollment (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}/enrollments/{enrollmentID}/status:
    put:
      description: "Accepting an enrollment assigned to a leg needs a free place on it: 409 when the leg's accepted crew already fills max_crew. 404 when the enrollment belongs to another cruise."
      operationId: update-cruise-enrollment-status
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
        - description: Enrollment ID
          in: path
          name: enrollmentID
          required: true
          schema:
            description: Enrollment ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentStatusBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a cruise enrollment's status (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}/enrollments/{enrollmentID}/trip:
    put:
      description: "Moving an accepted enrollment onto a leg needs a free place on it: 409 when the leg's accepted crew already fills max_crew. 404 when the enrollment belongs to another cruise."
      operationId: assign-cruise-enrollment-trip
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
        - description: Enrollment ID
          in: path
          name: enrollmentID
          required: true
          schema:
            description: Enrollment ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTripBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Assign a cruise enrollment to a trip (admin)
      tags:
        - Cruises
  /cruises/{cruiseID}/leg-sign-ups:
    get:
      description: One entry per trip of the cruise, in the cruise trip list order. 404 when the cruise does not exist.
      operationId: list-cruise-leg-sign-ups
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LegSignUp"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the caller's sign-up state for every leg of a cruise
      tags:
        - Sign-up
  /cruises/{cruiseID}/trip-enrollments:
    get:
      description: Trip enrollments of all the cruise's legs with the enrolled user, ordered by leg (embark date, then id) and sign-up time. 404 when the cruise does not exist.
      operationId: list-cruise-trip-enrollments
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TripEnrollmentDetail"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List every leg sign-up of a cruise (admin)
      tags:
        - Sign-up
  /cruises/{cruiseID}/trips:
    get:
      operationId: list-cruise-trips
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Trip"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a cruise's child trips
      tags:
        - Cruises
  /cruises/{cruiseID}/voyages:
    get:
      operationId: list-cruise-voyages
      parameters:
        - description: Cruise ID
          in: path
          name: cruiseID
          required: true
          schema:
            description: Cruise ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Voyage"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a cruise's child voyages
      tags:
        - Cruises
  /dashboard:
    get:
      description: Personal totals count voyages where the caller is the assigned captain or on the crew list through a crew record linked to their account.
      operationId: get-dashboard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Caller's sea time, plus club totals for admins
      tags:
        - Dashboard
  /enroll/{token}:
    get:
      operationId: resolve-enroll-token
      parameters:
        - description: Enrollment share token
          in: path
          name: token
          required: true
          schema:
            description: Enrollment share token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Resolve an enrollment token to its trip or cruise
      tags:
        - Enrollment
    post:
      description: "Creates a pending enrollment for the token's trip. A cruise token returns 422: sign-ups are per leg, made through enroll-cruise-legs."
      operationId: enroll
      parameters:
        - description: Enrollment share token
          in: path
          name: token
          required: true
          schema:
            description: Enrollment share token
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
