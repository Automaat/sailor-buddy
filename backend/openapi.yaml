        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a yacht
      tags:
        - Yachts
    get:
      operationId: get-yacht
      parameters:
        - description: Yacht ID
          in: path
          name: yachtID
          required: true
          schema:
            description: Yacht ID
