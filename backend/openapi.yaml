          type: string
        cost_per_person:
          format: double
          type: number
        cost_total:
          format: double
          type: number
        countries:
          type: string
        created_at:
          format: date-time
          type: string
        cruise_id:
          format: int64
          type: integer
        description:
          type: string
        disembark_date:
          type: string
        embark_date:
          type: string
        end_port:
          type: string
        enroll_token:
          type: string
        id:
          format: int64
          type: integer
        image_logo_url:
          type: string
        image_photo_url:
          type: string
        image_route_url:
          type: string
        max_crew:
          format: int64
          type: integer
        name:
          type: string
        org_id:
          format: int64
          type: integer
        owner_id:
          format: int64
