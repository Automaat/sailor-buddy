        not_included:
          description: What the price does not cover
          items:
            type: string
          type:
            - array
            - "null"
        start_port:
          type: string
        travel_notes:
          description: "How to get there: flights, transport, meeting point"
          type: string
        yacht_fund:
          description: Estimated yacht fund (kasa jachtowa) per person
          format: double
          type: number
      required:
