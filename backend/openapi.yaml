  /yachts/{yachtID}:
    delete:
      operationId: delete-yacht
      parameters:
        - description: Yacht ID
          in: path
          name: yachtID
          required: true
          schema:
            description: Yacht ID
            format: int64
            type: integer
      responses:
        "204":
