        embark_date:
          type: string
        end_port:
          type: string
        group_chat_url:
          description: Link to the crew group chat; omitted for anonymous callers
          type: string
        id:
          format: int64
          type: integer
        image_photo_url:
          type: string
        included:
          description: What the price covers
