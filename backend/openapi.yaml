            schema:
              $ref: "#/components/schemas/VoyageBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a voyage
      tags:
        - Voyages
  /yachts:
    get:
      operationId: list-yachts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Yacht"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List yachts
      tags:
        - Yachts
    post:
      operationId: create-yacht
      requestBody:
        content:
          application/json:
            schema:
