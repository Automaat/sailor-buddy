info:
  title: Sailor Buddy API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current authenticated user
      tags:
        - Auth
    put:
      operationId: update-me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatentBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update the current user's sailing patent
      tags:
        - Auth
  /crew:
    get:
      operationId: list-crew
      parameters:
        - description: Maximum number of items to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of items to return
            format: int32
            maximum: 100
            minimum: 1
            type: integer
        - description: Number of items to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip
            format: int32
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCrewMember"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List crew members
      tags:
        - Crew
    post:
      operationId: create-crew-member
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewMemberBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewMember"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a crew member
      tags:
        - Crew
  /crew/{crewID}:
    delete:
      operationId: delete-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a crew member
      tags:
        - Crew
    get:
      operationId: get-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewMember"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a crew member
      tags:
        - Crew
    put:
      operationId: update-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewMemberBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a crew member
      tags:
        - Crew
  /dashboard:
    get:
      operationId: get-dashboard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Owner sailing summary
      tags:
        - Dashboard
  /enroll/{token}:
    get:
      operationId: resolve-enroll-token
      parameters:
        - description: Enrollment share token
          in: path
          name: token
          required: true
          schema:
            description: Enrollment share token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Resolve an enrollment token to its trip or cruise
      tags:
        - Enrollment
    post:
      operationId: enroll
      parameters:
        - description: Enrollment share token
          in: path
          name: token
          required: true
          schema:
            description: Enrollment share token
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Self-enroll via a share token
      tags:
        - Enrollment
  /geocode:
    get:
      operationId: geocode
      parameters:
        - description: Town or place name to search for
          explode: false
          in: query
