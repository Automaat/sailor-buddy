info:
  title: Sailor Buddy API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current authenticated user
      tags:
        - Auth
  /crew:
    get:
      operationId: list-crew
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CrewMember"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List crew members
      tags:
        - Crew
    post:
      operationId: create-crew-member
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewMemberBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewMember"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a crew member
      tags:
        - Crew
  /crew/{crewID}:
    delete:
      operationId: delete-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a crew member
      tags:
        - Crew
    get:
      operationId: get-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrewMember"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a crew member
      tags:
        - Crew
    put:
      operationId: update-crew-member
      parameters:
        - description: Crew member ID
          in: path
          name: crewID
          required: true
          schema:
            description: Crew member ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewMemberBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
