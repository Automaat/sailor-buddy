components:
  schemas:
    CompleteTripBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CompleteTripBody.json
          format: uri
          readOnly: true
          type: string
        days:
          format: int64
          type: integer
        hours_engine:
          format: double
          type: number
        hours_over_6bf:
          format: double
          type: number
        hours_sail:
          format: double
          type: number
        hours_total:
          format: double
          type: number
        miles:
          format: double
          type: number
        tidal_waters:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      type: object
    Dashboard:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/Dashboard.json
          format: uri
          readOnly: true
          type: string
        by_year:
          items:
            $ref: "#/components/schemas/VoyagesByYear"
          type:
            - array
            - "null"
        total_days:
          format: int64
          type: integer
        total_hours:
          format: double
          type: number
        total_hours_engine:
          format: double
          type: number
        total_hours_sail:
          format: double
          type: number
        total_miles:
          format: double
          type: number
        voyage_count:
          format: int64
          type: integer
      required:
        - voyage_count
        - total_hours
        - total_miles
        - total_days
        - total_hours_sail
        - total_hours_engine
        - by_year
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Me:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/Me.json
          format: uri
          readOnly: true
          type: string
        avatar_url:
          type: string
        email:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - email
        - name
        - avatar_url
      type: object
    Training:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/Training.json
          format: uri
          readOnly: true
          type: string
        cost:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        date:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        organizer:
          type: string
        updated_at:
          format: date-time
          type: string
        url:
          type: string
        user_id:
          format: int64
          type: integer
      required:
        - id
        - user_id
        - name
        - created_at
        - updated_at
      type: object
    TrainingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/TrainingBody.json
          format: uri
          readOnly: true
          type: string
        cost:
          format: double
          type: number
        date:
          type: string
        name:
          description: Training name
          minLength: 1
          type: string
        organizer:
          type: string
        url:
          type: string
      required:
        - name
      type: object
    Trip:
