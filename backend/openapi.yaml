components:
  schemas:
    AssignTripBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/AssignTripBody.json
          format: uri
          readOnly: true
          type: string
        trip_id:
          description: Trip ID, or null to unassign
          format: int64
          type: integer
      type: object
    CaptainBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CaptainBody.json
          format: uri
          readOnly: true
          type: string
        is_captain:
          description: Whether the member belongs to the captain group
          type: boolean
      required:
        - is_captain
      type: object
    ClubSeaTime:
      additionalProperties: false
      properties:
        by_year:
          items:
            $ref: "#/components/schemas/VoyagesByYear"
          type:
            - array
            - "null"
        total:
          $ref: "#/components/schemas/SeaTime"
      required:
        - total
        - by_year
      type: object
    CompleteTripBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CompleteTripBody.json
          format: uri
          readOnly: true
          type: string
        days:
          format: int64
          type: integer
        hours_engine:
          format: double
          type: number
        hours_over_6bf:
          format: double
          type: number
        hours_sail:
          format: double
          type: number
        hours_total:
          format: double
          type: number
        miles:
          format: double
          type: number
        ports:
          description: Ports visited during the trip
          items:
            $ref: "#/components/schemas/VoyagePortBody"
          type:
            - array
            - "null"
        tidal_waters:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      type: object
    CrewAssignment:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CrewAssignment.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        crew_member_id:
          format: int64
          type: integer
        email:
          type: string
        full_name:
          type: string
        id:
          format: int64
          type: integer
        patent_number:
          type: string
        role:
          type: string
        trip_id:
          format: int64
          type: integer
        voyage_id:
          format: int64
          type: integer
      required:
        - id
        - crew_member_id
        - role
        - full_name
        - created_at
      type: object
    CrewAssignmentBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CrewAssignmentBody.json
          format: uri
          readOnly: true
          type: string
        crew_member_id:
          description: Crew member ID
          format: int64
          type: integer
        patent_number:
          type: string
        role:
          description: Assignment role
          minLength: 1
          type: string
      required:
        - crew_member_id
        - role
      type: object
    CrewMember:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CrewMember.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        email:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
        full_name:
          type: string
        id:
          format: int64
          type: integer
        patent_number:
          type: string
        phone:
          type: string
        pzz_license_number:
          type: string
        pzz_license_type:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          format: int64
          type: integer
      required:
        - id
        - full_name
        - created_at
        - updated_at
      type: object
    CrewMemberBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CrewMemberBody.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
        full_name:
          description: Crew member full name
          minLength: 1
          type: string
        patent_number:
          type: string
        phone:
          type: string
        pzz_license_number:
          type: string
        pzz_license_type:
          type: string
      required:
        - full_name
      type: object
    Cruise:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/Cruise.json
          format: uri
          readOnly: true
          type: string
        cost_per_person:
          description: Member price per person (czlonek, sympatyk)
          format: double
          type: number
        cost_per_person_non_member:
          description: Non-member (gosc) price per person
          format: double
          type: number
        countries:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        currency:
          description: Currency of every price on the cruise
          enum:
            - PLN
            - EUR
          type: string
        deposit:
          description: Refundable deposit (kaucja) per person
          format: double
          type: number
        description:
          type: string
        disembark_date:
          type: string
        edition:
          description: Edition label within the series, e.g. 2025 or 2026/27
          type: string
        embark_date:
          type: string
        end_port:
          type: string
        enroll_token:
          type: string
        group_chat_url:
          description: Link to the crew group chat (http or https)
          type: string
        id:
          format: int64
          type: integer
        image_logo_url:
          type: string
        image_photo_url:
          type: string
        image_route_url:
          type: string
        included:
          description: What the price covers
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          description: "Cruise kind: sea (morski) or inland (śródlądowy)"
          enum:
            - sea
            - inland
          type: string
        max_crew:
          format: int64
          type: integer
        min_age:
          description: Minimum crew age, shown as information only
          format: int64
          type: integer
        name:
          type: string
        not_included:
          description: What the price does not cover
          items:
            type: string
          type:
            - array
            - "null"
        series_id:
          description: Series this cruise is an edition of
          format: int64
          type: integer
        start_port:
          type: string
        travel_notes:
          description: "How to get there: flights, transport, meeting point"
          type: string
        updated_at:
          format: date-time
          type: string
        yacht_fund:
          description: "Estimated yacht fund (kasa jachtowa) per person: food, fuel, marinas"
          format: double
          type: number
      required:
        - id
        - name
        - kind
        - currency
        - included
        - not_included
        - created_at
        - updated_at
      type: object
    CruiseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CruiseBody.json
          format: uri
          readOnly: true
          type: string
        cost_per_person:
          description: Member price per person (czlonek, sympatyk)
          format: double
          minimum: 0
          type: number
        cost_per_person_non_member:
          description: Non-member (gosc) price per person
          format: double
          minimum: 0
          type: number
        countries:
          type: string
        currency:
          description: Currency of every price on the cruise; PLN when omitted
          enum:
            - PLN
            - EUR
          type: string
        deposit:
          description: Refundable deposit (kaucja) per person
          format: double
          minimum: 0
          type: number
        description:
          type: string
        disembark_date:
          type: string
        edition:
          description: Edition label within the series, e.g. 2025 or 2026/27
          maxLength: 50
          type: string
        embark_date:
          type: string
        end_port:
          type: string
        group_chat_url:
          description: Link to the crew group chat; must be an http or https URL, blank clears it
          maxLength: 2000
          type: string
        image_logo_url:
          type: string
        image_photo_url:
          type: string
        image_route_url:
          type: string
        included:
          description: What the price covers; blank entries are dropped, each at most 200 characters
          items:
            type: string
          maxItems: 30
          type:
            - array
            - "null"
        kind:
          default: sea
          description: "Cruise kind: sea (morski) or inland (śródlądowy)"
          enum:
            - sea
            - inland
          type: string
        max_crew:
          format: int64
          type: integer
        min_age:
          description: Minimum crew age, shown as information only; the app does not check it
          format: int64
          maximum: 99
          minimum: 0
          type: integer
        name:
          description: Cruise name
          minLength: 1
          type: string
        not_included:
          description: What the price does not cover; blank entries are dropped, each at most 200 characters
          items:
            type: string
          maxItems: 30
          type:
            - array
            - "null"
        series_id:
          description: Series this cruise is an edition of; omit or null for none
          format: int64
          type: integer
        start_port:
          type: string
        travel_notes:
          description: "How to get there: flights, transport, meeting point; blank clears it"
          maxLength: 5000
          type: string
        yacht_fund:
          description: "Estimated yacht fund (kasa jachtowa) per person: food, fuel, marinas"
          format: double
          minimum: 0
          type: number
      required:
        - name
      type: object
    CruiseEnrollmentDetail:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        cruise_id:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        note:
          type: string
        payment_status:
          description: "Manual payment status set by an admin: unpaid, deposit (first payment received) or paid (in full). Leg sign-ups only"
          enum:
            - unpaid
            - deposit
            - paid
          type: string
        status:
          type: string
        trip_id:
          format: int64
          type: integer
        trip_name:
          type: string
        updated_at:
          format: date-time
          type: string
        user_email:
          type: string
        user_id:
          format: int64
          type: integer
        user_name:
          type: string
        user_patent_number:
          type: string
        user_patent_type:
          type: string
        user_phone:
          type: string
      required:
        - user_name
        - user_email
        - id
        - user_id
        - status
        - created_at
        - updated_at
      type: object
    CruiseSeries:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/CruiseSeries.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        description:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - created_at
        - updated_at
      type: object
    CruiseSeriesBody:
      additionalProperties: false
