info:
  title: Sailor Buddy API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current authenticated user
      tags:
        - Auth
  /dashboard:
    get:
      operationId: get-dashboard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Owner sailing summary
      tags:
        - Dashboard
  /trainings:
    get:
      operationId: list-trainings
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Training"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List trainings
      tags:
        - Trainings
    post:
      operationId: create-training
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Training"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a training
      tags:
        - Trainings
  /trainings/{trainingID}:
    delete:
      operationId: delete-training
      parameters:
        - description: Training ID
          in: path
          name: trainingID
          required: true
          schema:
            description: Training ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a training
      tags:
        - Trainings
    get:
      operationId: get-training
      parameters:
        - description: Training ID
          in: path
          name: trainingID
          required: true
          schema:
            description: Training ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Training"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a training
      tags:
        - Trainings
    put:
      operationId: update-training
      parameters:
        - description: Training ID
          in: path
          name: trainingID
          required: true
          schema:
            description: Training ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a training
      tags:
        - Trainings
  /trips:
    get:
      operationId: list-trips
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Trip"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List trips
      tags:
        - Trips
    post:
      operationId: create-trip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a trip
      tags:
        - Trips
  /trips/{tripID}:
    delete:
      operationId: delete-trip
      parameters:
        - description: Trip ID
          in: path
          name: tripID
          required: true
          schema:
            description: Trip ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a trip
      tags:
        - Trips
    get:
      operationId: get-trip
      parameters:
        - description: Trip ID
          in: path
          name: tripID
          required: true
          schema:
            description: Trip ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a trip
      tags:
        - Trips
    put:
      operationId: update-trip
      parameters:
        - description: Trip ID
          in: path
          name: tripID
          required: true
          schema:
            description: Trip ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a trip
      tags:
        - Trips
  /trips/{tripID}/cancel:
    post:
      operationId: cancel-trip
      parameters:
        - description: Trip ID
          in: path
          name: tripID
          required: true
          schema:
            description: Trip ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Cancel a trip
      tags:
        - Trips
  /trips/{tripID}/complete:
    post:
      operationId: complete-trip
      parameters:
        - description: Trip ID
          in: path
          name: tripID
          required: true
          schema:
            description: Trip ID
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTripBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voyage"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Complete a trip into a voyage
      tags:
        - Trips
  /voyages:
    get:
      operationId: list-voyages
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Voyage"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List voyages
      tags:
        - Voyages
    post:
      operationId: create-voyage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoyageBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voyage"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a voyage
      tags:
        - Voyages
  /voyages/{voyageID}:
    delete:
      operationId: delete-voyage
      parameters:
        - description: Voyage ID
          in: path
          name: voyageID
          required: true
          schema:
            description: Voyage ID
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a voyage
      tags:
        - Voyages
    get:
      operationId: get-voyage
      parameters:
        - description: Voyage ID
          in: path
          name: voyageID
          required: true
          schema:
            description: Voyage ID
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voyage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a voyage
      tags:
        - Voyages
    put:
      operationId: update-voyage
      parameters:
        - description: Voyage ID
          in: path
          name: voyageID
          required: true
          schema:
            description: Voyage ID
            format: int64
            type: integer
      requestBody:
        content:
