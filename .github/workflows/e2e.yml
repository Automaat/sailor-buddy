name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sailor
          POSTGRES_PASSWORD: sailor
          POSTGRES_DB: sailor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sailor"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build backend
        working-directory: backend
        run: go build -o server ./cmd/api

      - name: Start Firebase Auth emulator
        run: |
          npm install -g firebase-tools@15.9.0
          firebase emulators:start --project sailor-buddy-dev --only auth &
          # wait for emulator to be ready
          for attempt in $(seq 1 30); do
            curl -s http://localhost:9099/ > /dev/null 2>&1 && break
            test "$attempt" -lt 30
            sleep 1
          done

      - name: Start backend
        working-directory: backend
        run: ./server &
        env:
          SAILOR_DATABASE_URL: postgres://sailor:sailor@localhost:5432/sailor?sslmode=disable
          SAILOR_FIREBASE_PROJECT_ID: sailor-buddy-dev
          SAILOR_LISTEN_ADDR: :8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          CORS_ALLOWED_ORIGINS: http://localhost:5173

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 30); do
            curl -s http://localhost:8080/api/auth/me > /dev/null 2>&1 && break
            test "$attempt" -lt 30
            sleep 1
          done

      - name: Start frontend dev server
        working-directory: frontend
        run: npm run dev &
        env:
          VITE_BACKEND_URL: http://localhost:8080
          VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
          VITE_FIREBASE_PROJECT_ID: sailor-buddy-dev

      - name: Wait for frontend
        run: |
          for attempt in $(seq 1 30); do
            curl -s http://localhost:5173/ > /dev/null 2>&1 && break
            test "$attempt" -lt 30
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
          FIREBASE_PROJECT_ID: sailor-buddy-dev
          API_BASE_URL: http://localhost:5173/api

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
