[tools]
go = "1.26.5"
node = "24"
golangci-lint = "2.12.2"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "v1.31.1"
"go:github.com/air-verse/air" = "v1.67.4"
"go:go.uber.org/nilaway/cmd/nilaway" = "v0.0.0-20260515015210-fd187751154f"
"npm:firebase-tools" = "15.25.1"

[tasks.dev]
description = "Start full stack via docker-compose (backend + frontend hot reload)"
run = "docker compose up --build"

[tasks.dev-backend]
description = "Run backend with hot reload (needs: mise run dev-emulator)"
run = "cd backend && SAILOR_DATABASE_URL=postgres://sailor:sailor@localhost:5432/sailor?sslmode=disable FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 air"

[tasks.dev-frontend]
description = "Run frontend dev server"
run = "cd frontend && npm run dev"

[tasks.dev-emulator]
description = "Start Firebase emulator in Docker"
run = "docker compose up --build firebase-emulator"

[tasks.migrate]
description = "Run database migrations"
run = "cd backend && go run cmd/migrate/main.go"

[tasks.sqlc]
description = "Generate sqlc code"
run = "cd backend && sqlc generate"

[tasks.gen-api]
description = "Regenerate openapi.yaml from Go code, then the frontend TS types"
run = [
  "cd backend && go run ./cmd/openapi",
  "cd frontend && npm run gen:api",
]

[tasks.test]
description = "Run all tests"
run = "cd backend && go test ./..."

[tasks.lint]
description = "Run Go linters (golangci-lint + nilaway)"
run = [
  "cd backend && golangci-lint run ./...",
  "cd backend && nilaway -include-pkgs=github.com/marcinskalski/sailor-buddy/backend ./...",
]
